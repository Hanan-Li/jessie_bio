# Workspace root: the Rust analogue of a Bazel WORKSPACE/MODULE.bazel.
# It lists member packages; they share one Cargo.lock and one target/ dir.
[workspace]
resolver = "3"
members = ["crates/*"]

# Settings every member can inherit with `edition.workspace = true`, etc.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

# Pinned third-party versions, declared once. Members opt in with
# `serde = { workspace = true }`.
[workspace.dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
csv = "1"
http-body-util = "0.1"
# `serde` lets templates receive any Serialize value.
minijinja = { version = "3", features = ["serde"] }
# Unix system calls; the agent uses it to send SIGTERM.
nix = { version = "0.31", features = ["signal", "process"] }
petgraph = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# Runtime-checked queries for now; compile-time checking (query!) needs a
# database or saved metadata at build time, added later (DESIGN.md §4.3).
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "json", "uuid"] }
tempfile = "3"
thiserror = "2"
tower = { version = "0.5", features = ["util"] }
# Row ids in the API, and agent tokens (random v4 UUIDs).
uuid = { version = "1", features = ["v4", "serde"] }
# Only the parts the agent uses: the multi-threaded runtime, #[tokio::main],
# child processes, files, timers and Ctrl-C.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "time", "signal", "io-util"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
