# Workspace root: the Rust analogue of a Bazel WORKSPACE/MODULE.bazel.
# It lists member packages; they share one Cargo.lock and one target/ dir.
[workspace]
resolver = "3"
members = ["crates/*"]

# Settings every member can inherit with `edition.workspace = true`, etc.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

# Pinned third-party versions, declared once. Members opt in with
# `serde = { workspace = true }`.
[workspace.dependencies]
anyhow = "1"
petgraph = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
