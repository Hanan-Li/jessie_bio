name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a branch cancels that branch's in-progress run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install

      # Caches ~/.cargo and target/ so dependencies aren't rebuilt every run.
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  nextflow-lint:
    runs-on: ubuntu-latest
    env:
      # Pinned like the Rust toolchain: a new Nextflow release can't change
      # what CI accepts until we upgrade on purpose.
      NXF_VER: 26.10.5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: curl -fsSL https://get.nextflow.io | bash && sudo mv nextflow /usr/local/bin/
      - run: nextflow lint nodes/
